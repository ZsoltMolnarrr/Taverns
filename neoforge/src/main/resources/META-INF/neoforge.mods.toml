modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/ZsoltMolnarrr/Taverns/issues"
license = "All Rights Reserved"

[[mods]]
modId = "village_taverns"
version = "${version}"
displayName = "Village Taverns (RPG Series)"
authors = "Daedelus"
description = '''
Find cozy taverns in villages, have a drink, and maybe some rest.
'''
logoFile = "icon.png"

[[dependencies.village_taverns]]
modId = "neoforge"
type = "required"
versionRange = "[21.11,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.village_taverns]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.11,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.village_taverns]]
modId = "structure_pool_api"
type = "required"
versionRange = "[${structure_pool_api_version},)"
ordering = "NONE"
side = "BOTH"

# Jar-in-jar'd (see neoforge/build.gradle `include(modImplementation(...))`); declared so the
# dependency is explicit rather than only implied by the bundled jar.
[[dependencies.village_taverns]]
modId = "tiny_config"
type = "required"
versionRange = "[${tiny_config_version},)"
ordering = "NONE"
side = "BOTH"


[[mixins]]
config = "village_taverns.mixins.json"
