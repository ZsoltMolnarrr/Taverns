# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Game
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.1
minecraft_compat_version=1.20.1

# Loader
enabled_platforms = fabric,forge
fabric_loader_version=0.19.5
forge_version=1.20.1-47.4.22

# Mod
maven_group=net.rpg_series
archives_name=village_taverns
mod_version=1.3.0.001

# Dependencies
fabric_api_version=0.92.12+1.20.1

# mavenLocal coordinates: net.tiny_config:tiny_config-<platform>:<version>
tiny_config_version=3.1.0.001
# Legacy published Fabric-only artifact (maven.modrinth:structure-pool-api); no Forge port on 1.20.1.
# Village injection therefore sits behind the `net.village_taverns.village.VillageStructures` seam.
structure_pool_api_version=1.0+1.20.1
# mavenLocal coordinates: net.spell_power:spell_power-<platform>:<version>
spell_power_version=1.6.0.001+1.20.1
# mavenLocal coordinates: net.foundation:ranged_weapon_api-<platform>:<version>
ranged_weapon_api_version=2.3.4.001+1.20.1
# mavenLocal coordinates: net.critical_strike:critical_strike-<platform>:<version>
critical_strike_version=1.0.4.002

# Forge 47 ships plain Mixin 0.8.5 and does not bundle MixinExtras; VillagerMixin uses @WrapOperation,
# so the Forge module has to JiJ it. 0.5.5+ only -- see toolchain-1.20.1-recipe.md.
mixin_extras_version=0.5.5
