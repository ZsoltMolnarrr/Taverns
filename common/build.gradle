architectury {
    common rootProject.enabled_platforms.split(',')
}

// Dummy platform for common compile
def platform = "fabric";

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url = 'https://maven.fabricmc.net' }

    mavenLocal()
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    implementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$project.fabric_api_version"

    implementation("maven.modrinth:tiny-config:${project.tiny_config_version}-${platform}")

    implementation("net.rpg_foundation:structure_pool_api-${platform}:${project.structure_pool_api_version}")
//    implementation("maven.modrinth:structure-pool-api:${project.structure_pool_api_version}-${platform}")
    implementation("net.spell_power:spell_power-${platform}:${project.spell_power_version}")
//    implementation("maven.modrinth:spell-power:${project.spell_power_version}-${platform}")
    implementation("net.rpg_foundation:ranged_weapon_api-${platform}:${project.ranged_weapon_api_version}")
//    implementation("maven.modrinth:ranged-weapon-api:${project.ranged_weapon_api_version}-${platform}")
    // Critical Strike (own mod) has no 26.1 build yet (being ported in parallel, not on Modrinth);
    // Taverns only references it by mod-id string through `Platform.util().isModLoaded("critical_strike")`
    // and by potion id, so the dependency is simply dropped.
    // Re-add `compileOnly("maven.modrinth:critical-strike:...")` once it is ported.
}
